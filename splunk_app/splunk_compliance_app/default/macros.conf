# =============================================================================
# ACME GenAI Compliance App — Macros
# =============================================================================
# To point this app at your own data:
#   1. Edit the acme_genai_index macro below
#   2. Change the index name and/or sourcetype to match your environment
#   3. All 30+ saved searches will automatically use your data source

[acme_genai_index]
definition = index=acme_agentic_telemetry sourcetype="otel:agentic:json"
iseval = 0

[acme_genai_index(1)]
args = extra_filter
definition = index=acme_agentic_telemetry sourcetype="otel:agentic:json" $extra_filter$
iseval = 0

# Time window macros for dashboard panels
[acme_last_24h]
definition = earliest=-24h latest=now
iseval = 0

[acme_last_7d]
definition = earliest=-7d latest=now
iseval = 0

[acme_last_30d]
definition = earliest=-30d latest=now
iseval = 0

# Risk score thresholds (editable without touching searches)
[acme_critical_cvss]
definition = 9.0
iseval = 0

[acme_high_cvss]
definition = 7.0
iseval = 0

[acme_medium_cvss]
definition = 4.0
iseval = 0

# Scenario index macros (telemetry field campaign_week = 1–10)
[acme_campaign_w1]
definition = `acme_genai_index` (campaign_week=1 OR cisco_aibom_status=* OR agent.aibom_validated=*)
iseval = 0

[acme_campaign_w2]
definition = `acme_genai_index` (campaign_week=2 OR foundry.trace_id=* OR foundry.orchestrator_override=*)
iseval = 0

[acme_campaign_w3]
definition = `acme_genai_index` (campaign_week=3 OR acme_input_guard_blocked=true OR acme_input_guard.rule_id=*)
iseval = 0

[acme_campaign_w4]
definition = `acme_genai_index` (campaign_week=4 OR slm.unapproved=true OR deployment.tier=shadow)
iseval = 0

[acme_campaign_w5]
definition = `acme_genai_index` (campaign_week=5 OR acme_output_guard.action=HARD_DENY OR acme_output_guard_blocked=true)
iseval = 0

[acme_campaign_w6]
definition = `acme_genai_index` (campaign_week=6 OR tool.scope_violation=true OR mcp.gateway.action=BLOCK)
iseval = 0

[acme_campaign_w7]
definition = `acme_genai_index` (campaign_week=7 OR call_depth_detected>=5)
iseval = 0

[acme_campaign_w8]
definition = `acme_genai_index` (campaign_week=8 OR cryptographic_passport_valid=false OR a2a.verification_failure=*)
iseval = 0

[acme_campaign_w9]
definition = `acme_genai_index` (campaign_week=9 OR galileo_observe_alert=true OR galileo_anomaly_score=*)
iseval = 0

[acme_campaign_w10]
definition = `acme_genai_index` (campaign_week=10 OR containment.action=QUARANTINE OR memory.policy.rule_id=MEM-POL-*)
iseval = 0

# Unified control / detection signal (used by matrix, heatmap, gap panels)
[acme_control_block]
definition = acme_output_guard_blocked=true OR acme_input_guard_blocked=true OR workflow.blocked=true OR tool_manifest_tampered=true OR memory.drift_detected=true OR privilege_creep_detected=true OR mcp.gateway.action=BLOCK OR (hitl_required=true AND hitl_bypassed=false) OR message.provenance_valid=false OR acme_output_guard_action=HARD_DENY OR acme_output_guard_action=QUARANTINE
iseval = 0

# Session window for workshop / golden-path validation
[acme_session_window]
definition = earliest=-15m latest=now
iseval = 0

# Phase 6 — heterogeneous agentic telemetry sources
[acme_sim_index]
definition = index=security sourcetype="acme:agentic:sim:json"
iseval = 0

[acme_thirdparty_index]
definition = index=acme_agentic_telemetry sourcetype="acme:agentic:thirdparty:json"
iseval = 0

[acme_registry_index]
definition = index=acme_agentic_telemetry sourcetype="acme:agentic:registry:json"
iseval = 0

[acme_agentic_all_sources]
definition = (`acme_genai_index`) OR (`acme_sim_index`) OR (`acme_thirdparty_index`) OR (`acme_registry_index`)
iseval = 0

[acme_sim_crosswalk_enrich]
definition = eval lookup_objective=coalesce(sim_objective, 'cisco_threat_taxonomy.objective') | eval lookup_technique=coalesce(sim_technique, 'cisco_threat_taxonomy.technique') | eval lookup_subtechnique=coalesce(sim_subtechnique, 'cisco_threat_taxonomy.subtechnique') | eval lookup_agent=coalesce(agent_name, 'agent.id') | lookup framework_compliance_crosswalk sim_objective AS lookup_objective sim_technique AS lookup_technique sim_subtechnique AS lookup_subtechnique agent_name AS lookup_agent OUTPUT owasp_classification mitre_atlas_id severity AS framework_severity eu_ai_act_risk_tier
iseval = 0

# Phase 11 — executive dashboard severity semantics (Splunk UI hex colors)
[acme_governance_status_colors]
definition = {"compliant":"0x53a051","needs-review":"0xf8be34","violation":"0xdc4e41"}
iseval = 0

[acme_governance_readiness_thresholds]
definition = {"compliant":80,"needs-review":50}
iseval = 0

[acme_tactic_colors]
definition = {"TA0001": "0xdc4e41", "TA0002": "0xf1813f", "TA0004": "0xf8be34", "TA0005": "0x0877a6", "TA0008": "0xdc4e41", "TA0009": "0xf1813f", "TA0040": "0x53a051", "UNMAPPED": "0x999999"}
iseval = 0
