# =============================================================================
# ACME GenAI Compliance App — Field Extraction (ships with app)
# Applies on Splunk Enterprise and Splunk Cloud search heads.
# HEC ingestion is configured separately (see INSTALL.md / Setup Guide dashboard).
# =============================================================================

[otel:agentic:json]
SHOULD_LINEMERGE = false
TRUNCATE = 0
LINE_BREAKER = ([\r\n]+)\Z
MAX_EVENTS = 256
ANNOTATE_PUNCT = false
NO_BINARY_CHECK = true
KV_MODE = json
INDEXED_EXTRACTIONS = json
CHARSET = UTF-8

# Primary timestamp from embedded event timestamp
TIME_PREFIX = "timestamp"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%Q%z
MAX_TIMESTAMP_LOOKAHEAD = 40

# OpenTelemetry envelope fallbacks
EXTRACT-otel_time_unixnano = "timeUnixNano"\s*:\s*"(?P<otel_time_unixnano>\d+)"

# GenAI semantic convention fields
EXTRACT-gen_ai_system = "gen_ai\.system"\s*:\s*"(?P<gen_ai_system>[^"]+)"
EXTRACT-gen_ai_request_model = "gen_ai\.request\.model"\s*:\s*"(?P<gen_ai_request_model>[^"]+)"
EXTRACT-gen_ai_operation_name = "gen_ai\.operation\.name"\s*:\s*"(?P<gen_ai_operation_name>[^"]+)"
EXTRACT-gen_ai_input_tokens = "gen_ai\.usage\.input_tokens"\s*:\s*(?P<gen_ai_input_tokens>\d+)
EXTRACT-gen_ai_output_tokens = "gen_ai\.usage\.output_tokens"\s*:\s*(?P<gen_ai_output_tokens>\d+)
EXTRACT-gen_ai_usage_input_tokens = "gen_ai\.usage\.input_tokens"\s*:\s*(?P<gen_ai_usage_input_tokens>\d+)
EXTRACT-gen_ai_usage_output_tokens = "gen_ai\.usage\.output_tokens"\s*:\s*(?P<gen_ai_usage_output_tokens>\d+)

# AcmeSentinel / AcmeGate security fields + CIM-style normalized fields (Phase 6)
EXTRACT-acme_output_guard_action = "acme_output_guard\.action"\s*:\s*"(?P<acme_output_guard_action>[^"]+)"
EXTRACT-acme_output_guard_blocked = "acme_output_guard_blocked"\s*:\s*(?P<acme_output_guard_blocked>true|false)
EXTRACT-acme_input_guard_blocked = "acme_input_guard_blocked"\s*:\s*(?P<acme_input_guard_blocked>true|false)

# Framework / kill-chain correlation fields
EXTRACT-technique_id = "technique_id"\s*:\s*"(?P<technique_id>[^"]+)"
EXTRACT-framework_technique_id = "framework\.technique_id"\s*:\s*"(?P<framework_technique_id>[^"]+)"
EXTRACT-incident_id = "incident_id"\s*:\s*"(?P<incident_id>[^"]+)"
EXTRACT-chain_id = "chain_id"\s*:\s*"(?P<chain_id>[^"]+)"
EXTRACT-chain_name = "chain_name"\s*:\s*"(?P<chain_name>[^"]+)"
EXTRACT-execution_mode = "execution_mode"\s*:\s*"(?P<execution_mode>[^"]+)"
EXTRACT-testbed_mode = "testbed_mode"\s*:\s*"(?P<testbed_mode>[^"]+)"
EXTRACT-rogue_actor_story = "rogue_actor_story"\s*:\s*"(?P<rogue_actor_story>[^"]+)"
EXTRACT-risk_statement = "risk_statement"\s*:\s*"(?P<risk_statement>[^"]+)"
EXTRACT-requesting_agent_id = "requesting_agent_id"\s*:\s*"(?P<requesting_agent_id>[^"]+)"
EXTRACT-target_agent_id = "target_agent_id"\s*:\s*"(?P<target_agent_id>[^"]+)"

# Agent identity fields
EXTRACT-agent_id = "agent\.id"\s*:\s*"(?P<agent_id>[^"]+)"
EXTRACT-gen_ai_agent_id = "gen_ai\.agent\.id"\s*:\s*"(?P<gen_ai_agent_id>[^"]+)"
EXTRACT-gen_ai_agent_name = "gen_ai\.agent\.name"\s*:\s*"(?P<gen_ai_agent_name>[^"]+)"

# Session / trace correlation
EXTRACT-session_id = "session_id"\s*:\s*"(?P<session_id>[^"]+)"
EXTRACT-trace_id = "trace_id"\s*:\s*"(?P<trace_id>[^"]+)"

# Cisco MLTK / anomaly hunting fields
EXTRACT-cisco_tsm_anomaly_score = "cisco_tsm_anomaly_score"\s*:\s*(?P<cisco_tsm_anomaly_score>[\d.]+)
EXTRACT-call_depth_detected = "call_depth_detected"\s*:\s*(?P<call_depth_detected>\d+)
EXTRACT-tokens_consumed_in_loop = "tokens_consumed_in_loop"\s*:\s*(?P<tokens_consumed_in_loop>\d+)
EXTRACT-mltk_ctsm_signal = "mltk\.ctsm_signal"\s*:\s*(?P<mltk_ctsm_signal>true|false)
EXTRACT-cisco_aibom_status = "cisco_aibom_status"\s*:\s*"(?P<cisco_aibom_status>[^"]+)"
EXTRACT-galileo_anomaly_score = "galileo_anomaly_score"\s*:\s*(?P<galileo_anomaly_score>[\d.]+)
EXTRACT-galileo_observe_alert = "galileo_observe_alert"\s*:\s*(?P<galileo_observe_alert>true|false)
EXTRACT-campaign_week = "campaign_week"\s*:\s*"(?P<campaign_week>\d+)"
CALCULATED-EVAL-norm_agent_identity = coalesce('gen_ai.agent.name', 'agent.id', 'gen_ai.agent.id')
CALCULATED-EVAL-norm_action = coalesce('acme_output_guard.action', if('acme_output_guard_blocked'=="true", "DENY", "ALLOW"))
CALCULATED-EVAL-norm_input_tokens = coalesce('gen_ai.usage.input_tokens', gen_ai_input_tokens)
CALCULATED-EVAL-norm_output_tokens = coalesce('gen_ai.usage.output_tokens', gen_ai_output_tokens)
CALCULATED-EVAL-norm_signature = coalesce('framework.technique_name', technique_id)
CALCULATED-EVAL-norm_technique_id = coalesce('framework.technique_id', technique_id)
CALCULATED-EVAL-norm_severity = coalesce('framework.severity', severity)
CALCULATED-EVAL-norm_mapped = if(isnotnull(norm_agent_identity) AND isnotnull(norm_action), 1, 0)

[acme:agentic:sim:json]
SHOULD_LINEMERGE = false
KV_MODE = json
INDEXED_EXTRACTIONS = json
CHARSET = UTF-8
EXTRACT-sim_objective = "objective"\s*:\s*"(?P<sim_objective>[^"]+)"
EXTRACT-sim_technique = "technique"\s*:\s*"(?P<sim_technique>[^"]+)"
EXTRACT-sim_subtechnique = "subtechnique"\s*:\s*"(?P<sim_subtechnique>[^"]+)"
EXTRACT-agent_name = "agent_name"\s*:\s*"(?P<agent_name>[^"]+)"
EXTRACT-policy_action = "policy_action"\s*:\s*"(?P<policy_action>[^"]+)"
EXTRACT-gen_ai_input_tokens = "gen_ai\.usage\.input_tokens"\s*:\s*(?P<gen_ai_input_tokens>\d+)
EXTRACT-gen_ai_output_tokens = "gen_ai\.usage\.output_tokens"\s*:\s*(?P<gen_ai_output_tokens>\d+)
CALCULATED-EVAL-norm_agent_identity = coalesce(agent_name, 'agent.id')
CALCULATED-EVAL-norm_action = coalesce(policy_action, "UNKNOWN")
CALCULATED-EVAL-norm_input_tokens = coalesce(gen_ai_input_tokens, 0)
CALCULATED-EVAL-norm_output_tokens = coalesce(gen_ai_output_tokens, 0)
CALCULATED-EVAL-norm_signature = coalesce(sim_objective, sim_technique)
CALCULATED-EVAL-norm_technique_id = coalesce(sim_technique, sim_subtechnique)
CALCULATED-EVAL-norm_severity = coalesce(severity, "unknown")
CALCULATED-EVAL-norm_mapped = if(isnotnull(norm_agent_identity) AND isnotnull(sim_objective), 1, 0)

[acme:agentic:thirdparty:json]
SHOULD_LINEMERGE = false
KV_MODE = json
INDEXED_EXTRACTIONS = json
CHARSET = UTF-8
EXTRACT-agent_id = "agent_id"\s*:\s*"(?P<agent_id>[^"]+)"
EXTRACT-threat_label = "threat_label"\s*:\s*"(?P<threat_label>[^"]+)"
EXTRACT-token_count_in = "token_count_in"\s*:\s*(?P<token_count_in>\d+)
EXTRACT-token_count_out = "token_count_out"\s*:\s*(?P<token_count_out>\d+)
EXTRACT-policy_result = "policy_result"\s*:\s*"(?P<policy_result>[^"]+)"
CALCULATED-EVAL-norm_agent_identity = agent_id
CALCULATED-EVAL-norm_action = coalesce(policy_result, "UNKNOWN")
CALCULATED-EVAL-norm_input_tokens = token_count_in
CALCULATED-EVAL-norm_output_tokens = token_count_out
CALCULATED-EVAL-norm_signature = threat_label
CALCULATED-EVAL-norm_technique_id = threat_label
CALCULATED-EVAL-norm_severity = coalesce(severity, "unknown")
CALCULATED-EVAL-norm_mapped = if(isnotnull(agent_id) AND isnotnull(threat_label), 1, 0)

[acme:agentic:registry:json]
SHOULD_LINEMERGE = false
KV_MODE = json
INDEXED_EXTRACTIONS = json
CHARSET = UTF-8
EXTRACT-agent_id = "agent_id"\s*:\s*"(?P<agent_id>[^"]+)"
EXTRACT-model_origin = "model_origin"\s*:\s*"(?P<model_origin>[^"]+)"
EXTRACT-owning_department = "owning_department"\s*:\s*"(?P<owning_department>[^"]+)"
EXTRACT-mcp_scope = "mcp_scope"\s*:\s*"(?P<mcp_scope>[^"]+)"
EXTRACT-trust_score = "trust_score"\s*:\s*(?P<trust_score>[0-9.]+)
EXTRACT-agent_status = "agent_status"\s*:\s*"(?P<agent_status>[^"]+)"
CALCULATED-EVAL-norm_agent_identity = agent_id
CALCULATED-EVAL-norm_action = agent_status
CALCULATED-EVAL-norm_signature = model_origin
CALCULATED-EVAL-norm_severity = if(trust_score>=0.85, "low", if(trust_score>=0.6, "medium", "high"))
CALCULATED-EVAL-norm_mapped = if(isnotnull(agent_id) AND isnotnull(agent_status), 1, 0)
