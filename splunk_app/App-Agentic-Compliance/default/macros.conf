# Legacy simulated-telemetry app — reusable search macros (Phase 6.3)

[acme_sim_index]
definition = index=security sourcetype="acme:agentic:sim:json"
iseval = 0

[acme_sim_crosswalk_enrich]
definition = eval lookup_objective=coalesce(sim_objective, 'cisco_threat_taxonomy.objective') | eval lookup_technique=coalesce(sim_technique, 'cisco_threat_taxonomy.technique') | eval lookup_subtechnique=coalesce(sim_subtechnique, 'cisco_threat_taxonomy.subtechnique') | eval lookup_agent=coalesce(agent_name, 'agent.id') | lookup framework_compliance_crosswalk sim_objective AS lookup_objective sim_technique AS lookup_technique sim_subtechnique AS lookup_subtechnique agent_name AS lookup_agent OUTPUT owasp_classification mitre_atlas_id severity AS framework_severity
iseval = 0

[acme_sim_token_normalize]
definition = eval input_tokens=coalesce(gen_ai_input_tokens, gen_ai.usage.input_tokens, 0) | eval output_tokens=coalesce(gen_ai_output_tokens, gen_ai.usage.output_tokens, 0) | eval total_tokens=input_tokens + output_tokens
iseval = 0
